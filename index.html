<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Vase</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div id="canvas">
        
        <div id="backgroundcircle"></div>
        <div id="bottomline"></div>

        <div id="stem1" class="stem"></div>
        <div id="stem2" class="stem"></div>
        <div id="stem3" class="stem"></div>
        <div id="stem4" class="stem"></div>
        <div id="stem5" class="stem"></div>
                <div id="curve1" class="curve"></div>
                <div id="curve2" class="curve"></div>
                <div id="curve3" class="curve"></div>

                    <div id="leaf1" class="leaf"></div>
                    <div id="leaf2" class="leaf"></div>
                    <div id="leaf3" class="leaf"></div>
                    <div id="leaf4" class="leaf"></div>
                    <div id="inside1" class="inside-stem"></div>
                    <div id="inside2" class="inside-stem"></div>
                    <div id="inside3" class="inside-stem"></div>

                    <div id="flower1">
                        <div id="pinkback"></div>
                        <div id="pinkfold1"></div>
                        <div id="pinkfold2"></div>
                        <div id="pinkfront"></div>
                         <div id="pinkdetail"></div>
                        
                    </div>

                    <div id="flower2">
                        <div class="tulip petal1"></div>
                        <div class="tulip petal2"></div>
                        <div class="tulip petal3"></div>
                        <div id="tulipbase"></div>
                    </div>

                    
<div id="flower3">
  <div id="redbase"></div>

  <div class="redpetal rp1"></div>
  <div class="redpetal rp2"></div>
  <div class="redpetal rp3"></div>
  <div class="redpetal rp4"></div>
  <div class="redpetal rp5"></div>
  <div class="redpetal rp6"></div>
  <div class="redpetal rp7"></div>
  <div class="redpetal rp8"></div>

  <div id="redmiddle"></div>
  <div class="seed s1"></div>
  <div class="seed s2"></div>
  <div class="seed s3"></div>
  <div class="seed s4"></div>
  <div class="seed s5"></div>
</div>


             <div id="vase">
                <div id="water"></div>
                <div id="shine1"></div>
                <div id="shine2"></div>
        </div>

    </div>


    
</body>
</html>
